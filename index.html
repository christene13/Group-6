<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Enterprise Income Tracker</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <link rel="stylesheet" href="style.css">

</head>

<body class="bg-light py-5">


  <main class="container">

    <div class="row justify-content-center">

      <div class="col-lg-8">


        <!-- Registration Card -->
        <div class="card shadow-sm border-0 mb-4">


          <div class="card-header bg-primary text-white py-3">

            <h1 class="h5 mb-0 fw-bold">
              Income Category Registration
            </h1>

          </div>


          <div class="card-body p-4">


            <form id="categoryForm">


              <div class="mb-3">

                <label class="form-label fw-semibold">
                  Category Name
                </label>

                <input type="text" id="txtCatName" class="form-control" placeholder="e.g., Consulting">

              </div>



              <div class="mb-3">

                <label class="form-label fw-semibold">
                  Description
                </label>

                <input type="text" id="txtCatDesc" class="form-control" placeholder="e.g., Enterprise support">

              </div>



              <button type="button" id="btnAdd" class="btn btn-primary px-4 fw-semibold">

                Save Category

              </button>


            </form>


          </div>

        </div>




        <!-- Table Card -->

        <div class="card shadow-sm border-0">


          <div class="card-header bg-white py-3 d-flex justify-content-between">


            <h2 class="h6 mb-0 text-secondary fw-bold">
              REGISTERED CATEGORIES
            </h2>


            <span id="categoryBadge" class="badge bg-primary">

              Active Categories: 0

            </span>


          </div>



          <div class="table-responsive">


            <table class="table table-hover mb-0">


              <thead class="table-light">

                <tr>

                  <th>
                    Category Name
                  </th>


                  <th>
                    Description
                  </th>


                </tr>

              </thead>



              <tbody id="listIncomeCat">


              </tbody>


            </table>


          </div>


        </div>



      </div>

    </div>


  </main>


  <script src="app.js"></script>


</body>

</html>
